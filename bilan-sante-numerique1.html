<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bilan de compétences en santé numérique</title>
<style>
:root{--fond:#f6f9f9;--carte:#fff;--encre:#16303a;--doux:#5b717a;--ligne:#d5e1e4;--accent:#0f6e7a;--accent-fonce:#0a525b;--rouge:#c0452f;--ambre:#d89a1d;--vert:#2c8a57}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Georgia,"Times New Roman",serif;color:var(--encre);background:var(--fond);padding:16px;overflow-y:auto}
.app{max-width:760px;margin:0 auto}
h1,h2,h3,button,.meta{font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif}
h1{font-size:1.5rem;margin:0 0 6px}
h2{font-size:1.2rem;line-height:1.4;margin:0 0 16px;font-weight:600}
p{line-height:1.6;margin:0 0 12px}
.carte{background:var(--carte);border:1px solid var(--ligne);border-radius:10px;padding:22px}
.meta{font-size:.85rem;color:var(--doux);margin-bottom:10px;display:flex;justify-content:space-between;gap:8px}
.progres{height:6px;background:var(--ligne);border-radius:3px;margin-bottom:18px;overflow:hidden}
.progres i{display:block;height:100%;background:var(--accent);transition:width .3s}
.choix{display:block;width:100%;text-align:left;font-size:1rem;line-height:1.45;padding:13px 15px;margin-bottom:10px;background:#fff;color:var(--encre);border:1.5px solid var(--ligne);border-radius:8px;cursor:pointer}
.choix:hover{border-color:var(--accent)}
.choix.sel{border-color:var(--accent);background:#e6f3f4}
:focus-visible{outline:3px solid var(--ambre);outline-offset:2px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.btn{font-size:1rem;padding:11px 20px;border-radius:8px;border:1.5px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
.btn:hover{background:var(--accent-fonce)}
.btn.sec{background:#fff;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.dom{margin-bottom:14px}
.dom-t{display:flex;justify-content:space-between;font-family:"Trebuchet MS",Arial,sans-serif;font-size:.95rem;margin-bottom:4px}
.barre{height:14px;background:var(--ligne);border-radius:7px;overflow:hidden}
.barre i{display:block;height:100%;border-radius:7px;transition:width .6s}
.priorite{border-left:5px solid var(--rouge);padding:4px 0 4px 14px;margin:0 0 16px}
.priorite.moyen{border-color:var(--ambre)}
.priorite.fort{border-color:var(--vert)}
.priorite h3{margin:0 0 4px;font-size:1.05rem}
.etiq{font-size:.8rem;font-weight:700;color:var(--doux)}
.sous-t{margin:22px 0 10px;font-size:1.1rem}
@media(max-width:480px){.carte{padding:16px}h1{font-size:1.25rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ============================================================
   CONFIGURATION : modifiez uniquement cette section
   Chaque réponse porte un score : 2 = maîtrisé, 1 = partiel, 0 = à travailler
   ============================================================ */
const TITRE = "Bilan de compétences en santé numérique";
const INTRO = "Répondez à 15 questions pour découvrir dans quels domaines concentrer vos efforts de formation.";

// Seuils (en % du score maximal du domaine)
const SEUIL_PRIORITAIRE = 50;   // en dessous : domaine prioritaire
const SEUIL_SOLIDE = 80;        // à partir de : domaine solide

const DOMAINES = [
  { id:"cyber", nom:"Cybersécurité",
    conseils:{
      prioritaire:"Commencez par ce domaine : mots de passe robustes, authentification à deux facteurs, repérage de l’hameçonnage et gestes à adopter en cas d’incident.",
      moyen:"Vos bases sont là. Consolidez la gestion des accès et la détection des courriels frauduleux.",
      solide:"Vous maîtrisez les bonnes pratiques. Partagez-les avec vos collègues et restez à jour sur les nouvelles menaces."},
    questions:[
      {q:"Comment gérez-vous vos mots de passe professionnels ?",r:[["J’utilise un gestionnaire de mots de passe et un mot de passe unique par service",2],["J’ai quelques mots de passe que je varie un peu",1],["J’utilise le même mot de passe presque partout",0]]},
      {q:"Vous recevez un courriel urgent d’un « service informatique » demandant votre mot de passe. Que faites-vous ?",r:[["Je ne réponds pas, je vérifie par un autre canal et je le signale",2],["Je me méfie mais je clique sur le lien pour vérifier",1],["Je réponds pour éviter le blocage de mon compte",0]]},
      {q:"À quelle fréquence utilisez-vous l’authentification à deux facteurs ?",r:[["Dès qu’elle est disponible",2],["Seulement quand elle est obligatoire",1],["Je ne sais pas ce que c’est ou je ne l’utilise pas",0]]}
    ]},
  { id:"donnees", nom:"Données de santé",
    conseils:{
      prioritaire:"Priorité à ce domaine : confidentialité, secret professionnel, consentement du patient et règles de partage des données (RGPD, hébergement agréé).",
      moyen:"Vous connaissez les principes. Approfondissez le consentement, la traçabilité des accès et le partage entre professionnels.",
      solide:"Votre gestion des données de santé est rigoureuse. Pensez à vous tenir informé des évolutions réglementaires."},
    questions:[
      {q:"Savez-vous quelles données de santé relèvent d’un régime de protection renforcée ?",r:[["Oui, et je sais comment les traiter",2],["J’en ai une idée générale",1],["Non, pas vraiment",0]]},
      {q:"Un collègue vous demande des informations sur un patient qu’il ne suit pas. Que faites-vous ?",r:[["Je refuse sauf si le partage est justifié et encadré",2],["Je les transmets s’il me semble de confiance",1],["Je les donne volontiers, nous sommes dans la même équipe",0]]},
      {q:"Où stockez-vous les fichiers contenant des données de patients ?",r:[["Uniquement sur des outils validés et sécurisés par mon établissement",2],["Parfois sur une clé USB ou un cloud personnel",1],["Là où c’est le plus pratique",0]]}
    ]},
  { id:"comm", nom:"Communication en santé",
    conseils:{
      prioritaire:"Travaillez ce domaine en priorité : messageries sécurisées, rédaction de messages clairs et posture professionnelle sur les réseaux.",
      moyen:"Vous communiquez correctement. Renforcez le choix des canaux sécurisés et la clarté des échanges avec les patients.",
      solide:"Vous communiquez de façon claire et sécurisée. Vous pouvez servir de référent pour vos pairs."},
    questions:[
      {q:"Quel canal utilisez-vous pour échanger des informations cliniques avec un confrère ?",r:[["Une messagerie sécurisée de santé",2],["Le courriel classique, parfois",1],["Une application de messagerie grand public",0]]},
      {q:"Comment adaptez-vous vos échanges numériques avec les patients ?",r:[["Je vérifie leur aisance numérique et j’adapte le canal et le langage",2],["J’utilise toujours le même canal",1],["Je n’y ai jamais réfléchi",0]]},
      {q:"Que publiez-vous sur les réseaux sociaux à propos de votre activité ?",r:[["Rien d’identifiant, et je respecte la déontologie",2],["Des anecdotes que je pense anonymes",1],["Je partage librement mon quotidien professionnel",0]]}
    ]},
  { id:"outils", nom:"Outils numériques en santé",
    conseils:{
      prioritaire:"Ce domaine est à renforcer : dossier patient informatisé, Mon espace santé, agenda partagé et outils validés par votre établissement.",
      moyen:"Vous utilisez plusieurs outils. Explorez leurs fonctions avancées et l’interopérabilité entre eux.",
      solide:"Vous êtes à l’aise avec les outils numériques. Testez les nouveautés et accompagnez vos collègues dans leur prise en main."},
    questions:[
      {q:"Comment vous sentez-vous face à un nouveau logiciel métier ?",r:[["Je l’explore, je consulte l’aide et je forme les autres",2],["Je l’utilise après une formation guidée",1],["Je l’évite tant que possible",0]]},
      {q:"Connaissez-vous Mon espace santé et le DMP ?",r:[["Oui, je sais l’utiliser et l’expliquer aux patients",2],["J’en ai entendu parler",1],["Non",0]]},
      {q:"Comment évaluez-vous la fiabilité d’une application de santé avant de la recommander ?",r:[["Je vérifie le marquage CE, l’éditeur, les avis de sources officielles",2],["Je regarde les notes dans la boutique d’applications",1],["Je ne l’évalue pas",0]]}
    ]},
  { id:"tele", nom:"Télésanté",
    conseils:{
      prioritaire:"Concentrez-vous ici : cadre de la téléconsultation et du télésoin, matériel, consentement et organisation d’une séance à distance.",
      moyen:"Vous connaissez les bases. Perfectionnez l’organisation des séances et la gestion des situations techniques ou cliniques imprévues.",
      solide:"Vous maîtrisez la télésanté. Aidez votre équipe à structurer ses pratiques à distance."},
    questions:[
      {q:"Savez-vous dans quels cas la téléconsultation est adaptée ou non ?",r:[["Oui, je sais justifier le choix et les limites",2],["En partie",1],["Non",0]]},
      {q:"Avant une téléconsultation, que vérifiez-vous ?",r:[["L’identité, le consentement, la qualité de connexion et un plan B",2],["La connexion uniquement",1],["Rien de particulier",0]]},
      {q:"Comment réagissez-vous si l’état du patient nécessite un examen physique en cours de séance ?",r:[["J’ai une procédure : réorientation ou orientation vers l’urgence",2],["J’improvise au cas par cas",1],["Je ne sais pas quoi faire",0]]}
    ]}
];

/* ============================================================
   MOTEUR : ne pas modifier sauf besoin particulier
   ============================================================ */
const app = document.getElementById("app");
// Liste aplatie des questions
const TOUTES = [];
DOMAINES.forEach((d,di)=>d.questions.forEach((q,qi)=>TOUTES.push({di,qi,q})));
let idx = -1;
const reponses = new Array(TOUTES.length).fill(null);

const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function accueil(){
  app.innerHTML = `<div class="carte"><h1>${esc(TITRE)}</h1><p>${esc(INTRO)}</p>
  <p class="meta">${TOUTES.length} questions · ${DOMAINES.length} domaines</p>
  <div class="nav"><span></span><button class="btn" id="go">Commencer</button></div></div>`;
  document.getElementById("go").onclick = () => { idx = 0; question(); };
}

function question(){
  const {q} = TOUTES[idx];
  const pct = Math.round(idx / TOUTES.length * 100);
  app.innerHTML = `<div class="carte">
    <div class="meta"><span>Question ${idx+1} sur ${TOUTES.length}</span></div>
    <div class="progres" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <h2>${esc(q.q)}</h2>
    <div role="radiogroup" aria-label="Réponses">
      ${q.r.map((r,i)=>`<button class="choix${reponses[idx]===i?" sel":""}" role="radio" aria-checked="${reponses[idx]===i}" data-i="${i}">${esc(r[0])}</button>`).join("")}
    </div>
    <div class="nav">
      <button class="btn sec" id="prec" ${idx===0?"disabled":""}>Précédent</button>
      <button class="btn" id="suiv" ${reponses[idx]===null?"disabled":""}>${idx===TOUTES.length-1?"Voir mon bilan":"Suivant"}</button>
    </div></div>`;
  app.querySelectorAll(".choix").forEach(b=>b.onclick=()=>{
    reponses[idx] = +b.dataset.i;
    app.querySelectorAll(".choix").forEach(x=>{const s=x===b;x.classList.toggle("sel",s);x.setAttribute("aria-checked",s)});
    document.getElementById("suiv").disabled = false;
  });
  document.getElementById("prec").onclick = () => { idx--; question(); };
  document.getElementById("suiv").onclick = () => { idx++; idx<TOUTES.length ? question() : bilan(); };
}

function calculer(){
  return DOMAINES.map((d,di)=>{
    let score=0, max=0;
    TOUTES.forEach((t,i)=>{
      if(t.di!==di) return;
      max += Math.max(...t.q.r.map(r=>r[1]));
      score += t.q.r[reponses[i]][1];
    });
    const pct = max ? Math.round(score/max*100) : 0;
    const niveau = pct < SEUIL_PRIORITAIRE ? "prioritaire" : pct < SEUIL_SOLIDE ? "moyen" : "solide";
    return {...d, score, max, pct, niveau};
  });
}

function bilan(){
  const res = calculer();
  const tri = [...res].sort((a,b)=>a.pct-b.pct);
  const couleur = {prioritaire:"var(--rouge)",moyen:"var(--ambre)",solide:"var(--vert)"};
  const libelle = {prioritaire:"À travailler en priorité",moyen:"À consolider",solide:"Point fort"};
  const classe = {prioritaire:"",moyen:"moyen",solide:"fort"};
  const prio = tri.filter(d=>d.niveau==="prioritaire");
  let synthese;
  if(prio.length===0) synthese = "Bravo : aucun domaine n’est en difficulté. Visez maintenant l’approfondissement et le partage de vos pratiques.";
  else if(prio.length===1) synthese = `Votre effort doit porter sur un domaine : ${prio[0].nom}.`;
  else synthese = `Votre effort doit porter sur ${prio.length} domaines, en commençant par ${prio[0].nom}.`;

  app.innerHTML = `<div class="carte">
    <h1>Votre bilan personnalisé</h1>
    <p>${esc(synthese)}</p>
    ${res.map(d=>`<div class="dom"><div class="dom-t"><span>${esc(d.nom)}</span><span>${d.pct} %</span></div>
      <div class="barre" role="img" aria-label="${esc(d.nom)} : ${d.pct} %"><i style="width:${d.pct}%;background:${couleur[d.niveau]}"></i></div></div>`).join("")}
    <h2 class="sous-t">Vos pistes, du domaine le plus fragile au plus solide</h2>
    ${tri.map(d=>`<div class="priorite ${classe[d.niveau]}"><span class="etiq">${libelle[d.niveau]}</span>
      <h3>${esc(d.nom)}</h3><p>${esc(d.conseils[d.niveau])}</p></div>`).join("")}
    <div class="nav"><button class="btn sec" id="rev">Revoir mes réponses</button><button class="btn" id="rec">Recommencer</button></div></div>`;
  document.getElementById("rec").onclick = () => { reponses.fill(null); idx=-1; accueil(); };
  document.getElementById("rev").onclick = () => { idx=0; question(); };
}

accueil();
</script>
</body>
</html>
